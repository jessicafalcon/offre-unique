[client]
toolbarMode = "minimal"
showErrorDetails = false   # public link: never show tracebacks or file paths to visitors

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
# "Pie bavarde" palette: black, navy (the blue sheen of the magpie's wings), white
base = "light"
primaryColor = "#1F3A7A"
textColor = "#0B0C0C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF1F7"
linkColor = "#1F3A7A"
borderColor = "#B1B4B6"
dataframeHeaderBackgroundColor = "#EEF1F7"
baseFontSize = 17
baseRadius = "small"
